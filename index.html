    <style>
      /* First paint, before any JS or CSS bundle: dark page plus a still of the room (no blur: Vision recruiter look §1). */
      html, body { margin: 0; background: #0b0b0e; color: #e8e2da; }
      #poster { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #0b0b0e; transition: opacity 1s ease; }
      #poster img { width: 100%; height: 100%; object-fit: cover; }
      #poster.out { opacity: 0; }
      .list-mode #poster { display: none; }
    </style>
    <noscript><style>#poster { display: none; }</style></noscript>

    <div id="poster" aria-hidden="true"><img src="/poster.jpg" alt="" decoding="async" fetchpriority="high" onerror="this.remove()" /></div>
