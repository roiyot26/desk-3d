<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0e'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='%23f0b273' text-anchor='middle'%3ERY%3C/text%3E%3C/svg%3E" />
    <!--HEAD-->
    <style>
      /* First paint, before any JS or CSS bundle: dark page plus a blurred still of the room. */
      html, body { margin: 0; background: #0b0b0e; color: #e8e2da; }
      #poster { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: #0b0b0e; transition: opacity 1s ease; }
      #poster img { width: 100%; height: 100%; object-fit: cover; filter: blur(3px) brightness(0.7); transform: scale(1.02); }
      #poster.out { opacity: 0; }
      .list-mode #poster { display: none; }
    </style>
    <noscript><style>#poster { display: none; }</style></noscript>
  </head>
  <body>
    <div id="poster" aria-hidden="true"><img src="/poster.jpg" alt="" decoding="async" fetchpriority="high" onerror="this.remove()" /></div>
    <div id="root"></div>
    <noscript><!--NOSCRIPT--></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
